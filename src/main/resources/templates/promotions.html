<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Promotions — Gestion de notes HEI</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 8px 12px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      a {
        display: inline-block;
        margin-right: 8px;
        padding: 6px 12px;
        background-color: #1a73e8;
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
      }
      a.tn {
        background-color: #188038;
      }
    </style>
  </head>
  <body>
    <h1>Promotions</h1>
    <table>
      <thead>
        <tr>
          <th>Promotion</th>
          <th>Diplômés</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="promotion : ${promotions}">
          <td th:text="${promotion.label}">2024</td>
          <td>
            <a
              th:href="@{/download/graduates/{id}(id=${promotion.id},track='EL')}"
            >
              Diplômés EL
            </a>
            <a
              class="tn"
              th:href="@{/download/graduates/{id}(id=${promotion.id},track='TN')}"
            >
              Diplômés TN
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
